[package]
name = "mw3-master"
description = "TeknoMW3 TCP master server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mw3-master"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
mw3-protocol = { path = "../mw3-protocol" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
