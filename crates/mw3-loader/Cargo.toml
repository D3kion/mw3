[package]
name = "mw3-loader"
description = "TeknoMW3 launcher utilities: teknogods.ini, game argv builders, update-check"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mw3-loader"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indexmap = "2"
thiserror = "2"
ureq = { version = "2.12", default-features = false }
